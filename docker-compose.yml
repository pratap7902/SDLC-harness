services:
  db:
    image: mysql:8.0
    container_name: srs-db
    environment:
      MYSQL_ROOT_PASSWORD: srs
      MYSQL_DATABASE: srs
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3311:3306"
    volumes:
      - srs-db:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psrs"]
      interval: 3s
      retries: 30

volumes:
  srs-db:
